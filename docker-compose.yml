services:
  db:
    image: postgres:16
    ports:
      # host:contenedor — el lado derecho es fijo: Postgres escucha en 5432
      # dentro de la imagen. Solo el izquierdo es nuestro.
      - "5434:5432"
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
