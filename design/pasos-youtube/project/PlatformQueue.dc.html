<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pendientes de la plataforma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c0e}
a{color:#cff245}a:hover{color:#e4ff7a}
</style>
</helmet>
<div style="width: 1280px; min-height: 720px; box-sizing: border-box; padding: 48px 56px; background: #0b0c0e; color: #e8e9ea; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">

  <h1 style="margin: 0; font-size: 28px; font-weight: 700">Pendientes</h1>

  <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid #2a2e35">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <li style="display: grid; grid-template-columns: minmax(0, 1fr) 120px 200px; gap: 24px; align-items: center; padding: 16px 0; border-bottom: 1px solid #2a2e35">
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 16px; font-weight: 700">{{ r.action }} · {{ r.channel }}</span>
          <span style="font-size: 14px; color: #a3a9b1">{{ r.detail }}</span>
        </div>
        <span style="font-size: 14px; color: {{ r.dueColor }}">{{ r.due }}</span>
        <div style="display: flex; justify-content: flex-end">
          <sc-if value="{{ r.pending }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ r.run }}" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 3px; background: #cff245; color: #0b0c0e; font: inherit; font-size: 15px; font-weight: 700">{{ r.cta }}</button>
          </sc-if>
          <sc-if value="{{ r.busy }}" hint-placeholder-val="{{ false }}">
            <span aria-busy="true" style="font-size: 14px; color: #a3a9b1">Registrando…</span>
          </sc-if>
          <sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 14px; color: #5eead4">Avisamos a las partes</span>
          </sc-if>
        </div>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { status: {} };
}
renderVals() {
const s = this.state;
const all = [
{ id: 'a1', action: 'Aceptar la invitación', channel: 'Pc Lover', detail: 'Enviada a [CUENTA DE CUSTODIA]', due: 'Hoy', urgent: true, cta: 'Ya la acepté' },
{ id: 'a2', action: 'Confirmar el traspaso', channel: 'Recetas Rápidas', detail: 'La plataforma tiene que figurar como propietario principal', due: 'Mañana', urgent: true, cta: 'Confirmar' },
{ id: 'a3', action: 'Revisar la comisión', channel: 'Tecno Ya', detail: 'AR$ 142.500 · CUIT 20-30123456-7', due: '25 de octubre', urgent: false, cta: 'Ver el comprobante' },
{ id: 'a4', action: 'Invitar al comprador', channel: 'Gaming Sur', detail: 'comprador@correo.com', due: '26 de octubre', urgent: false, cta: 'Ya lo invité' },
{ id: 'a5', action: 'Hacer propietario al comprador', channel: 'Viajes 360', detail: 'Lleva 7 días como administrador', due: '27 de octubre', urgent: false, cta: 'Ya lo hice' },
{ id: 'a6', action: 'Resolver un reclamo', channel: 'Fitness Diario', detail: 'El vendedor sigue en los permisos', due: '28 de octubre', urgent: false, cta: 'Ver el reclamo' },
];
return {
rows: all.map((r) => {
const st = s.status[r.id];
return {
...r,
dueColor: r.urgent ? '#fbbf24' : '#a3a9b1',
pending: !st,
busy: st === 'busy',
done: st === 'done',
run: () => {
this.setState({ status: { ...s.status, [r.id]: 'busy' } });
setTimeout(() => this.setState({ status: { ...this.state.status, [r.id]: 'done' } }), 900);
},
};
}),
};
}
}
</script>
</body>
</html>
