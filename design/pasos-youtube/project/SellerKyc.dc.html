<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Verificar la identidad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c0e}
a{color:#cff245}a:hover{color:#e4ff7a}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none!important}}
</style>
</helmet>
<div style="width: 720px; min-height: 800px; box-sizing: border-box; padding: 56px 48px; background: #0b0c0e; color: #e8e9ea; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px">

  <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 14px; color: #a3a9b1">Paso 5 de 5</span>
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.2">Verificá tu identidad</h1>
      </div>

      <label style="display: flex; flex-direction: column; gap: 8px; max-width: 320px">
        <span style="font-size: 15px">Número de DNI</span>
        <input type="text" inputmode="numeric" placeholder="30123456" style="min-height: 52px; padding: 0 16px; border: 1px solid #2a2e35; border-radius: 3px; background: #141619; color: #e8e9ea; font-family: 'JetBrains Mono', monospace; font-size: 17px">
      </label>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{ photos }}" as="ph" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 15px">{{ ph.label }}</span>
            <sc-if value="{{ ph.done }}" hint-placeholder-val="{{ false }}">
              <div role="img" aria-label="Vista previa de la foto" style="height: 116px; border-radius: 5px; background: #e8e9ea; display: flex; flex-direction: column; gap: 8px; padding: 14px; box-sizing: border-box">
                <span style="height: 34px; width: 28px; background: #8c939c; border-radius: 3px"></span>
                <span style="height: 6px; width: 80%; background: #c9cdd2; border-radius: 2px"></span>
                <span style="height: 6px; width: 60%; background: #c9cdd2; border-radius: 2px"></span>
              </div>
            </sc-if>
            <button type="button" onClick="{{ ph.attach }}" style="min-height: 48px; padding: 0 12px; border: 1px solid #2a2e35; border-radius: 3px; background: transparent; color: #e8e9ea; font: inherit; font-size: 15px">{{ ph.cta }}</button>
          </div>
        </sc-for>
      </div>

      <button type="button" onClick="{{ send }}" disabled="{{ notReady }}" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 3px; background: {{ sendBg }}; color: {{ sendColor }}; font: inherit; font-size: 16px; font-weight: 700">Publicar el canal</button>
    </div>
  </sc-if>

  <sc-if value="{{ isChecking }}" hint-placeholder-val="{{ false }}">
    <div aria-busy="true" style="display: flex; align-items: center; gap: 14px; padding-top: 40px">
      <span class="spinner" style="width: 22px; height: 22px; border: 2px solid #2a2e35; border-top-color: #cff245; border-radius: 50%; animation: spin 0.8s linear infinite"></span>
      <span style="font-size: 17px">Verificando tu identidad…</span>
      <button type="button" onClick="{{ ok }}" style="min-height: 44px; padding: 0 12px; border: 1px dashed #2a2e35; border-radius: 3px; background: transparent; color: #838a94; font: inherit; font-size: 12px">Simular verificada</button>
      <button type="button" onClick="{{ fail }}" style="min-height: 44px; padding: 0 12px; border: 1px dashed #2a2e35; border-radius: 3px; background: transparent; color: #838a94; font: inherit; font-size: 12px">Simular rechazo</button>
    </div>
  </sc-if>

  <sc-if value="{{ isPublished }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 20px; padding-top: 40px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.2">Pc Lover está publicado</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #a3a9b1">Te avisaremos cuando recibas una oferta.</p>
      <a href="SellerAccess.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 3px; background: #cff245; color: #0b0c0e; font-size: 16px; font-weight: 700; text-decoration: none">Ver el canal</a>
    </div>
  </sc-if>

  <sc-if value="{{ isRejected }}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="display: flex; flex-direction: column; gap: 20px; padding-top: 40px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.2">No pudimos leer el frente del DNI</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #a3a9b1">Sacá la foto con buena luz y sin reflejos.</p>
      <button type="button" onClick="{{ retry }}" style="align-self: flex-start; min-height: 52px; padding: 0 24px; border: 1px solid #2a2e35; border-radius: 3px; background: transparent; color: #e8e9ea; font: inherit; font-size: 16px">Adjuntar otra foto</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":800}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { view: 'form', done: { front: false, back: false, selfie: false } };
}
renderVals() {
const s = this.state;
const items = [
{ id: 'front', label: 'Frente del DNI' },
{ id: 'back', label: 'Dorso del DNI' },
{ id: 'selfie', label: 'Tu cara' },
];
const ready = items.every((i) => s.done[i.id]);
return {
photos: items.map((i) => ({
label: i.label,
done: s.done[i.id],
cta: s.done[i.id] ? 'Cambiar la foto' : 'Adjuntar foto',
attach: () => this.setState({ done: { ...s.done, [i.id]: true } }),
})),
isForm: s.view === 'form',
isChecking: s.view === 'checking',
isPublished: s.view === 'published',
isRejected: s.view === 'rejected',
notReady: !ready,
sendBg: ready ? '#cff245' : '#2a2e35',
sendColor: ready ? '#0b0c0e' : '#8c939c',
send: () => { if (ready) this.setState({ view: 'checking' }); },
ok: () => this.setState({ view: 'published' }),
fail: () => this.setState({ view: 'rejected' }),
retry: () => this.setState({ view: 'form', done: { ...s.done, front: false } }),
};
}
}
</script>
</body>
</html>
